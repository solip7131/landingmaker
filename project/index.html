<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>요식업 대표님들을 위한 랜딩페이지 제작소</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Black+Han+Sans&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          mint: { DEFAULT: '#00C896', deep: '#00A878', dark: '#008f66', light: '#E6FBF4', soft: '#D2F6EB' },
          punch: { DEFAULT: '#FF6B35', deep: '#F2581F' },
          gold: { DEFAULT: '#E8C572', deep: '#C9A24B', light: '#FBF1D8' },
          ink: '#0E2C24',
        },
        fontFamily: {
          sans: ['"Noto Sans KR"', 'sans-serif'],
          display: ['"Black Han Sans"', '"Noto Sans KR"', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Sans KR', sans-serif; color: #0E2C24; background: #fff; -webkit-font-smoothing: antialiased; }

  /* ---- scroll reveal ---- */
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal-d1 { transition-delay: .08s; }
  .reveal-d2 { transition-delay: .16s; }
  .reveal-d3 { transition-delay: .24s; }
  .reveal-d4 { transition-delay: .32s; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ---- hero food particles ---- */
  @keyframes floatUp {
    0%   { transform: translateY(20px) rotate(0deg); opacity: 0; }
    12%  { opacity: .9; }
    88%  { opacity: .9; }
    100% { transform: translateY(-120px) rotate(var(--spin,20deg)); opacity: 0; }
  }
  .particle { position: absolute; will-change: transform, opacity; animation: floatUp var(--dur,9s) linear infinite; }

  /* ---- floating CTA pulse ---- */
  @keyframes ctaPulse {
    0%,100% { box-shadow: 0 14px 34px rgba(255,107,53,.42), 0 0 0 0 rgba(255,107,53,.5); }
    50%     { box-shadow: 0 14px 40px rgba(255,107,53,.55), 0 0 0 14px rgba(255,107,53,0); }
  }
  .cta-pulse { animation: ctaPulse 2.4s ease-in-out infinite; }

  /* ---- modal transitions ---- */
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(28px) scale(.96); } to { opacity: 1; transform: none; } }
  .overlay-in { animation: overlayIn .25s ease forwards; }
  .sheet-in { animation: sheetIn .34s cubic-bezier(.2,.8,.2,1) forwards; }

  /* ---- decorative blob spin ---- */
  @keyframes slowspin { to { transform: rotate(360deg); } }
  .slowspin { animation: slowspin 26s linear infinite; }

  /* ---- arrow bounce ---- */
  @keyframes bobble { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  .bobble { animation: bobble 1.6s ease-in-out infinite; }

  /* ---- gold shimmer ---- */
  @keyframes shimmer { to { background-position: 200% center; } }
  .gold-text {
    background: linear-gradient(100deg, #8a6a1e 0%, #C9A24B 30%, #f6e3a6 50%, #C9A24B 70%, #8a6a1e 100%);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shimmer 4s linear infinite;
  }

  /* scrollbar inside modal */
  .nice-scroll::-webkit-scrollbar { width: 8px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: #C7EFE2; border-radius: 99px; }
  .nice-scroll::-webkit-scrollbar-track { background: transparent; }

  .no-spin::-webkit-outer-spin-button, .no-spin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="modal.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
